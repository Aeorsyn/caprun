[package]
name = "caprun"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
landlock = "0.4"
libc = "0.2"
pollster = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "48"
wgpu = "23"
