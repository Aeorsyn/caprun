<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HYPERFOLD 4D // Powered by caprun</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;background:#050811;color:#e2e8f0;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#wrap{position:relative;width:min(94vmin,760px);height:min(94vmin,760px);border:1px solid #1e3a5f;border-radius:10px;box-shadow:0 0 40px #0ea5e944;overflow:hidden;cursor:crosshair;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:13px;pointer-events:none;text-shadow:0 0 8px #000}
.bw{width:130px;height:10px;background:#0f172a;border:1px solid #38bdf8;border-radius:5px;overflow:hidden;margin-top:4px}
#shbar{height:100%;width:100%;background:linear-gradient(90deg,#06b6d4,#34d399)}
#foot{position:absolute;bottom:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:11px;color:#7dd3fc;text-shadow:0 0 6px #000}
#foot a{color:#34d399;text-decoration:none;pointer-events:auto}
#ov{position:absolute;inset:0;background:#050811d8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#ov h1{margin:0 0 8px;color:#38bdf8;letter-spacing:3px;font-size:26px}
#ov p{margin:4px 0;color:#cbd5e1;font-size:13px}
button{margin-top:14px;background:#0284c7;color:#fff;border:1px solid #38bdf8;padding:10px 24px;border-radius:6px;font-family:monospace;font-size:14px;cursor:pointer}
button:hover{background:#0369a1}
#lb{margin-top:14px;font-size:12px;color:#34d399;text-align:left;min-width:250px}
</style></head><body>
<div id=wrap>
  <canvas id=gpu width=768 height=768></canvas>
  <canvas id=fg width=512 height=512></canvas>
  <div id=hud>
    <div>SCORE <b id=sc>0</b> &nbsp; WAVE <b id=wv>1</b> &nbsp; x<b id=mp>1</b></div>
    <div>SHIELD <span id=shv>100%</span><div class=bw><div id=shbar></div></div></div>
  </div>
  <div id=foot>
    <span id=tel>WebGPU: initializing...</span>
    <a href="https://github.com/YOUR_USERNAME/caprun" target="_blank">Built with caprun (1 TFLOPS Wasm+Vulkan Sandbox) -></a>
  </div>
  <div id=ov>
    <h1>HYPERFOLD 4D</h1>
    <p>Client-Side WebGPU Gyroid Tunnel</p>
    <p style="color:#94a3b8">Mouse/Touch/WASD: Steer & Bank | Click/Space: Fire | Shift: Boost</p>
    <button id=startBtn>LAUNCH SORTIE</button>
    <div id=lb></div>
  </div>
</div>
<script>
const WGSL = `
struct U { t: f32, sx: f32, sy: f32, pad: f32 };
@group(0) @binding(0) var<uniform> u: U;
struct VSOut { @builtin(position) pos: vec4<f32>, @location(0) uv: vec2<f32> };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VSOut {
  var p = array<vec2<f32>, 3>(vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
  var o: VSOut; o.pos = vec4<f32>(p[i], 0.0, 1.0); o.uv = p[i]; return o;
}
fn rot(a: f32) -> mat2x2<f32> { let c = cos(a); let s = sin(a); return mat2x2<f32>(c,-s,s,c); }
fn gyroid(p: vec3<f32>, sc: f32) -> f32 { let q = p * sc; return dot(sin(q), cos(q.yzx)) / sc; }
fn map(p_in: vec3<f32>, t: f32) -> f32 {
  var p = p_in;
  let tw = rot(p.z * 0.22 + t * 0.25) * p.xy; p.x = tw.x; p.y = tw.y;
  let g1 = gyroid(p + vec3<f32>(0.0, 0.0, t * 1.8), 2.0);
  let g2 = gyroid(p * 1.7 - vec3<f32>(t * 0.5, 0.0, 0.0), 3.2) * 0.32;
  return max(abs(g1 + g2) - 0.13, 0.74 - length(p.xy));
}
@fragment fn fs(in: VSOut) -> @location(0) vec4<f32> {
  let uv = in.uv; let t = u.t;
  let ro = vec3<f32>(u.sx * 0.32, -u.sy * 0.28, 0.0);
  var rd = normalize(vec3<f32>(uv.x, uv.y, 1.35));
  let b = rot(-u.sx * 0.42) * rd.xy; rd.x = b.x; rd.y = b.y;
  let y = rot(u.sx * 0.35) * rd.xz; rd.x = y.x; rd.z = y.y;
  let pt = rot(u.sy * 0.28) * rd.yz; rd.y = pt.x; rd.z = pt.y;
  var dist = 0.0; var glow = vec3<f32>(0.0); var hit = false;
  for (var i = 0u; i < 64u; i = i + 1u) {
    let p = ro + rd * dist; let d = map(p, t);
    let ph = 0.5 + 0.5 * cos(t * 0.7 + dist * 0.46 + vec3<f32>(0.0, 2.1, 4.2));
    glow = glow + ph * (0.011 / (0.045 + abs(d)));
    if (d < 0.005) { hit = true; break; }
    dist = dist + d * 0.80; if (dist > 14.0) { break; }
  }
  var col = glow * 0.14;
  if (hit) {
    let p = ro + rd * dist; let e = 0.006;
    let n = normalize(vec3<f32>(
      map(p+vec3(e,0.0,0.0),t)-map(p-vec3(e,0.0,0.0),t),
      map(p+vec3(0.0,e,0.0),t)-map(p-vec3(0.0,e,0.0),t),
      map(p+vec3(0.0,0.0,e),t)-map(p-vec3(0.0,0.0,e),t)));
    let fres = pow(1.0 - max(dot(n, -rd), 0.0), 2.4);
    let irid = 0.5 + 0.5 * cos(dot(n, rd) * 4.0 + dist * 0.55 + vec3<f32>(0.2, 2.3, 4.1));
    col = col + irid * (0.35 + 0.85 * fres) * exp(-dist * 0.15);
  }
  col = col / (col + vec3<f32>(1.0));
  return vec4<f32>(col, 1.0);
}`;
const gpuCanvas=document.getElementById('gpu'), fg=document.getElementById('fg'), ctx=fg.getContext('2d');
const ov=document.getElementById('ov'), scEl=document.getElementById('sc'), wvEl=document.getElementById('wv');
const mpEl=document.getElementById('mp'), shvEl=document.getElementById('shv'), shbar=document.getElementById('shbar');
const tel=document.getElementById('tel'), lb=document.getElementById('lb');

let gpuReady=false, device, gctx, pipe, ubuf, bg, udata=new Float32Array(4);
async function initWebGPU(){
  if(!navigator.gpu){ tel.textContent='WebGPU unavailable (use Chrome/Edge/Firefox Nightly)'; return; }
  const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
  if(!adapter){ tel.textContent='No WebGPU adapter found'; return; }
  device=await adapter.requestDevice();
  gctx=gpuCanvas.getContext('webgpu');
  const fmt=navigator.gpu.getPreferredCanvasFormat();
  gctx.configure({device, format:fmt, alphaMode:'opaque'});
  const mod=device.createShaderModule({code:WGSL});
  pipe=device.createRenderPipeline({
    layout:'auto',
    vertex:{module:mod, entryPoint:'vs'},
    fragment:{module:mod, entryPoint:'fs', targets:[{format:fmt}]},
    primitive:{topology:'triangle-list'}
  });
  ubuf=device.createBuffer({size:16, usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  bg=device.createBindGroup({layout:pipe.getBindGroupLayout(0), entries:[{binding:0, resource:{buffer:ubuf}}]});
  gpuReady=true;
}
initWebGPU();

let actx=null;
function sfx(f1,f2,dur,type='sawtooth',vol=0.07){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+dur);
    g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

let running=false, simT=0, fpsN=0, fpsT=performance.now(), fps='60.0';
let px=0, py=0, tx=0, ty=0, keys={}, firing=false, boost=false;
let score=0, wave=1, kills=0, mult=1, shield=100, fireCd=0, spawnCd=0, flash=0;
let bolts=[], enemies=[], ebolts=[], sparks=[], rings=[];

window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space'){firing=true;e.preventDefault();} if(e.code==='ShiftLeft'||e.code==='ShiftRight') boost=true; });
window.addEventListener('keyup', e=>{ keys[e.code]=false; if(e.code==='Space') firing=false; if(e.code==='ShiftLeft'||e.code==='ShiftRight') boost=false; });
fg.addEventListener('pointermove', e=>{
  const r=fg.getBoundingClientRect();
  tx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width)*2-1));
  ty=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height)*2-1));
});
fg.addEventListener('pointerdown', e=>{ if(e.button===2) boost=true; else firing=true; });
window.addEventListener('pointerup', ()=>{ firing=false; boost=false; });
fg.addEventListener('contextmenu', e=>e.preventDefault());

function proj(x,y,z){ const s=1/Math.max(0.18,z); return {sx:256+(x-px*0.45)*210*s, sy:256+(y-py*0.45)*210*s, s}; }
function boom(x,y,z,col,n=16){
  rings.push({x,y,z,r:6,life:1,col});
  for(let i=0;i<n;i++){ const a=Math.random()*6.283, sp=0.02+Math.random()*0.07; sparks.push({x,y,z,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:(Math.random()-0.5)*0.08,life:1,col}); }
}
function renderLB(){
  const top=JSON.parse(localStorage.getItem('hf4d_top')||'[]');
  if(top.length) lb.innerHTML='<b>LOCAL TOP RUNS</b><br>'+top.map((t,i)=>`#${i+1} &nbsp; ${String(t.s).padStart(6,' ')} pts &nbsp; W${t.w} &nbsp; K${t.k}`).join('<br>');
}
renderLB();

function startRun(){
  score=0; wave=1; kills=0; mult=1; shield=100; flash=0;
  bolts=[]; enemies=[]; ebolts=[]; sparks=[]; rings=[];
  running=true; ov.style.display='none'; sfx(220,880,0.2,'triangle',0.09);
}
document.getElementById('startBtn').addEventListener('click', startRun);

function gameOver(){
  running=false; sfx(180,45,0.45,'sawtooth',0.12);
  const top=JSON.parse(localStorage.getItem('hf4d_top')||'[]');
  top.push({s:score,w:wave,k:kills}); top.sort((a,b)=>b.s-a.s);
  localStorage.setItem('hf4d_top', JSON.stringify(top.slice(0,5)));
  ov.style.display='flex'; ov.querySelector('h1').textContent='HULL BREACHED';
  ov.querySelector('p').textContent=`FINAL SCORE: ${score}  |  WAVE ${wave}  |  KILLS: ${kills}`;
  document.getElementById('startBtn').textContent='FLY AGAIN'; renderLB();
}

let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  simT += dt * (boost ? 4.8 : 2.6);
  fpsN++; if(now-fpsT>=500){ fps=(fpsN*1000/(now-fpsT)).toFixed(1); fpsN=0; fpsT=now; }
  if(gpuReady){
    udata[0]=simT; udata[1]=px; udata[2]=py; udata[3]=0;
    device.queue.writeBuffer(ubuf,0,udata);
    const enc=device.createCommandEncoder();
    const pass=enc.beginRenderPass({colorAttachments:[{view:gctx.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});
    pass.setPipeline(pipe); pass.setBindGroup(0,bg); pass.draw(3); pass.end();
    device.queue.submit([enc.finish()]);
    tel.textContent=`WebGPU 768x768 | ${fps} FPS | 0 B server load`;
  }
  let kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let ky=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(kx||ky){ tx=Math.max(-1,Math.min(1,tx+kx*dt*1.9)); ty=Math.max(-1,Math.min(1,ty+ky*dt*1.9)); }
  px+=(tx-px)*Math.min(1,dt*11); py+=(ty-py)*Math.min(1,dt*11);
  ctx.clearRect(0,0,512,512);
  if(running){
    wave=1+Math.floor(kills/10); fireCd-=dt; spawnCd-=dt; flash=Math.max(0,flash-dt*3);
    if(firing&&fireCd<=0){ fireCd=boost?0.08:0.12; bolts.push({x:px-0.11,y:py+0.07,z:0.45},{x:px+0.11,y:py+0.07,z:0.45}); sfx(820,260,0.07,'square',0.04); }
    if(spawnCd<=0){
      spawnCd=Math.max(0.28,1.05-wave*0.07);
      const kind=(wave>=2&&Math.random()<0.28)?2:(Math.random()<0.45?1:0);
      enemies.push({x:(Math.random()*2-1)*0.85,y:(Math.random()*2-1)*0.75,z:6.8,hp:kind===2?3:1,kind,ph:Math.random()*6.28,spd:1.4+wave*0.18+(kind===1?0.5:0),shot:0.9+Math.random()*1.2});
    }
    for(let i=bolts.length-1;i>=0;i--){
      const b=bolts[i]; b.z+=dt*(boost?12:9.5);
      const p=proj(b.x,b.y,b.z), p2=proj(b.x,b.y,Math.max(0.2,b.z-0.35));
      ctx.strokeStyle='#38bdf8'; ctx.lineWidth=Math.max(1.5,4*p.s);
      ctx.beginPath(); ctx.moveTo(p2.sx,p2.sy); ctx.lineTo(p.sx,p.sy); ctx.stroke();
      if(b.z>7.5) bolts.splice(i,1);
    }
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i]; e.z-=dt*(e.spd+(boost?1.2:0)); e.ph+=dt*2.6;
      e.x+=Math.sin(e.ph)*(e.kind===1?0.55:0.25)*dt; e.y+=Math.cos(e.ph*0.8)*0.22*dt; e.shot-=dt;
      if(e.shot<=0&&e.z>1.6&&e.z<5.2){ e.shot=Math.max(0.9,2.2-wave*0.1); ebolts.push({x:e.x,y:e.y,z:e.z,vx:(px-e.x)*0.45,vy:(py-e.y)*0.45}); }
      let hit=false;
      for(let j=bolts.length-1;j>=0;j--){
        const b=bolts[j];
        if(Math.abs(b.z-e.z)<0.45&&Math.hypot(b.x-e.x,b.y-e.y)<(e.kind===2?0.28:0.22)){
          bolts.splice(j,1); e.hp--; hit=true;
          if(e.hp<=0){ kills++; score+=(e.kind===2?300:100)*mult; mult=Math.min(8,mult+1); boom(e.x,e.y,e.z,e.kind===2?'#f43f5e':'#34d399',e.kind===2?24:14); sfx(260,60,0.16,'sawtooth',0.08); enemies.splice(i,1); break; }
          else{ boom(e.x,e.y,e.z,'#facc15',6); sfx(520,300,0.05,'triangle',0.05); }
        }
      }
      if(!enemies[i]) continue;
      if(e.z<0.55){ if(Math.hypot(e.x-px,e.y-py)<0.32){shield-=22;mult=1;flash=1;sfx(120,40,0.22,'sawtooth',0.1);} enemies.splice(i,1); continue; }
      const p=proj(e.x,e.y,e.z), rad=Math.max(4,(e.kind===2?26:18)*p.s);
      ctx.save(); ctx.translate(p.sx,p.sy); ctx.rotate(e.ph);
      ctx.strokeStyle=hit?'#fff':(e.kind===2?'#f43f5e':(e.kind===1?'#facc15':'#22d3ee'));
      ctx.lineWidth=2; ctx.beginPath(); const sides=e.kind===2?6:(e.kind===1?4:3);
      for(let k=0;k<=sides;k++){ const a=k*6.283/sides; k?ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad); }
      ctx.stroke(); ctx.restore();
    }
    for(let i=ebolts.length-1;i>=0;i--){
      const eb=ebolts[i]; eb.z-=dt*3.6; eb.x+=eb.vx*dt; eb.y+=eb.vy*dt;
      const p=proj(eb.x,eb.y,eb.z); ctx.fillStyle='#fb7185'; ctx.beginPath(); ctx.arc(p.sx,p.sy,Math.max(2,7*p.s),0,6.283); ctx.fill();
      if(eb.z<0.48){ if(Math.hypot(eb.x-px,eb.y-py)<0.26){shield-=14;mult=1;flash=1;sfx(140,55,0.18,'sawtooth',0.09);} ebolts.splice(i,1); }
    }
    const sx=256+px*185, sy=256+py*185;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(px*0.45);
    ctx.strokeStyle=boost?'#facc15':'#38bdf8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(22,12); ctx.lineTo(6,7); ctx.lineTo(0,14); ctx.lineTo(-6,7); ctx.lineTo(-22,12); ctx.closePath(); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='#38bdf888'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(sx,sy,12,0,6.283); ctx.stroke();
    if(flash>0){ ctx.fillStyle=`rgba(244,63,94,${flash*0.35})`; ctx.fillRect(0,0,512,512); }
    scEl.textContent=score; wvEl.textContent=wave; mpEl.textContent=mult;
    shvEl.textContent=Math.max(0,Math.round(shield))+'%'; shbar.style.width=Math.max(0,shield)+'%';
    if(shield<=0) gameOver();
  }
  for(let i=rings.length-1;i>=0;i--){ const g=rings[i]; g.life-=dt*2.4; g.r+=dt*90; const p=proj(g.x,g.y,g.z); ctx.strokeStyle=g.col; ctx.globalAlpha=Math.max(0,g.life); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.sx,p.sy,g.r*p.s,0,6.283); ctx.stroke(); ctx.globalAlpha=1; if(g.life<=0) rings.splice(i,1); }
  for(let i=sparks.length-1;i>=0;i--){ const sp=sparks[i]; sp.x+=sp.vx; sp.y+=sp.vy; sp.z+=sp.vz; sp.life-=dt*2.2; const p=proj(sp.x,sp.y,Math.max(0.2,sp.z)); ctx.fillStyle=sp.col; ctx.globalAlpha=Math.max(0,sp.life); ctx.fillRect(p.sx-2,p.sy-2,4,4); ctx.globalAlpha=1; if(sp.life<=0) sparks.splice(i,1); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
